[project]

    name = "nest_tools"
    requires-python = ">=3.9"
    dependencies = [ "numpy", "scipy", "matplotlib", "ase" ,"setuptools"]
    dynamic = ["version"]


[tool.setuptools.packages.find]
    exclude = [ "test*" ]

[tool.setuptools.dynamic]
    version = {attr  = "nest_tools.__version__"}

[build-system]
    requires = ["setuptools", "wheel"]
    build-backend = "setuptools.build_meta"

